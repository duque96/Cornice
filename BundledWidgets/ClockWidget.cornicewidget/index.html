<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: transparent;
      color: var(--cornice-ink, #ffffff);
      font-family: var(--cornice-font, -apple-system, system-ui, sans-serif);
    }
    .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 100%;
      padding: 0 2px;
    }
    .time {
      font-size: calc(var(--cornice-value-size, 16px) * 1.4);
      font-weight: var(--cornice-value-weight, 600);
      letter-spacing: 0.4px;
      font-variant-numeric: tabular-nums;
    }
    .meta {
      text-align: right;
      line-height: 1.3;
    }
    .day {
      font-size: var(--cornice-label-size, 10px);
      color: var(--cornice-ink-label, rgba(255, 255, 255, 0.58));
    }
    .zone {
      font-size: var(--cornice-meta-size, 9.5px);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--cornice-ink-meta, rgba(255, 255, 255, 0.4));
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="time" id="time">--:--</div>
    <div class="meta">
      <div class="day" id="day"></div>
      <div class="zone" id="zone"></div>
    </div>
  </div>

  <script>
    const LOCALE = (window.cornice && cornice.language) === 'es' ? 'es-ES' : 'en-GB';

    function render(timestamp) {
      const now = timestamp ? new Date(timestamp) : new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString(LOCALE, {
        hour: '2-digit',
        minute: '2-digit'
      });
      document.getElementById('day').textContent = now.toLocaleDateString(LOCALE, {
        weekday: 'short',
        day: 'numeric',
        month: 'short'
      });
      document.getElementById('zone').textContent =
        LOCALE === 'es-ES' ? 'Europa/Madrid' : Intl.DateTimeFormat().resolvedOptions().timeZone;
    }

    cornice.onTick(render);
    render();
  </script>
</body>
</html>
